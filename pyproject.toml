[project]
name = "bll"
version = "0.1.0"
description = "Bilingual subtitle language learning: inject Japanese words into English subtitles"
requires-python = ">=3.9"
dependencies = [
    "pysubs2>=1.6",
    "fugashi[unidic-lite]>=1.3",
    "wordfreq[cjk]>=3.0",
    "pykakasi>=2.2",
    "simplemma>=1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
bll = "bll.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bll"]

[tool.setuptools.package-data]
bll = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bll.db", "bll.timeline", "bll.gloss"]
disallow_untyped_defs = true

# Unannotated, out-of-scope modules that mypy now walks as a side effect of
# checking bll/ at all. Neither carries any signature annotations (out of
# scope per the design), so pre-existing patterns invisible to a
# never-configured type checker surface here (e.g. untyped module-level
# containers, old implicit-Optional defaults). Kept permissive rather than
# hand-annotated, consistent with the design's "should mostly be
# skipped/permissive" guidance for files this issue doesn't touch.
[[tool.mypy.overrides]]
module = ["bll.jmdict", "bll.web"]
ignore_errors = true
